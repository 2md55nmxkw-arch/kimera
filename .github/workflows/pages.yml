# Сборка сайта и выкладка на GitHub Pages: на каждый push в main и по кнопке.
#
# Модель персонажа и танец из файла лежат в репозитории запечатанными (sealed/): их
# авторы запрещают раздавать файлы. Ключ — в секрете ASSETS_KEY; при сборке модель
# кладётся на сайт вшитой, не файлом .vrm (см. scripts/assets.mjs). Без ключа — в чужой
# копии репозитория — сайт собирается с заглушкой вместо модели.
name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Новая выкладка отменяет ту, что ещё идёт.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
      - id: pages
        uses: actions/configure-pages@v6
      - run: npm ci
      - run: node scripts/assets.mjs unlock
        env:
          ASSETS_KEY: ${{ secrets.ASSETS_KEY }}
      # Проверка типов и сборка. Сайт лежит в папке /<репозиторий>/ — её адрес даёт Pages.
      - run: npm run check
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}/
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
