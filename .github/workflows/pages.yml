# Сборка сайта и выкладка на GitHub Pages: на каждый push в main и по кнопке.
#
# Модели персонажа и танца из файла в репозитории нет (их авторы запрещают раздавать
# файлы, см. README), поэтому сайт собирается без них: вместо модели стоит заглушка.
name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Новая выкладка отменяет ту, что ещё идёт.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
      - id: pages
        uses: actions/configure-pages@v6
      - run: npm ci
      # Проверка типов и сборка. Сайт лежит в папке /<репозиторий>/ — её адрес даёт Pages.
      - run: npm run check
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}/
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
